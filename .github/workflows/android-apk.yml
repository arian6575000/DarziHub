name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: DarziHubApp
        run: npm install --legacy-peer-deps

      - name: Typecheck
        working-directory: DarziHubApp
        run: npx tsc --noEmit

      - name: Generate native Android project
        working-directory: DarziHubApp
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: DarziHubApp/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarziHub-apk
          path: DarziHubApp/android/app/build/outputs/apk/release/*.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DarziHub APK #${{ github.run_number }}
          files: DarziHubApp/android/app/build/outputs/apk/release/*.apk
